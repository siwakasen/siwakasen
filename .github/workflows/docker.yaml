name: Build and Push Docker Images

on:
  push:
    branches: [master]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Prepare environment variables
        id: vars
        run: |
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          COMMIT_MESSAGE=$(git log -1 --pretty=%B)
          {
            echo "SHORT_SHA=$SHORT_SHA"
            echo "COMMIT_MESSAGE<<EOF"
            echo "$COMMIT_MESSAGE"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Check for skip keywords
        id: skip-check
        run: |
          if echo "${COMMIT_MESSAGE}" | grep -qE "(skip:build|ci:skip|chore:)"; then
            echo "skip=true" >> $GITHUB_ENV
            echo "Skipping workflow because commit contains skip keyword."
          else
            echo "skip=false" >> $GITHUB_ENV
          fi

      - name: Diagnose registry connectivity
        if: env.skip == 'false'
        env:
          REGISTRY_URL: ${{ vars.REGISTRY_URL }}
        run: |
          for family in -4 -6; do
            echo "Registry connectivity ($family); HTTP 200 or 401 is expected"
            curl "$family" --verbose --connect-timeout 10 --max-time 20 \
              --output /dev/null --write-out '\nHTTP %{http_code}; remote IP %{remote_ip}\n' \
              "https://${REGISTRY_URL}/v2/" || true
          done

      - name: Log in to Registry
        if: env.skip == 'false'
        env:
          REGISTRY_URL: ${{ vars.REGISTRY_URL }}
          REGISTRY_USER: ${{ vars.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          : "${REGISTRY_URL:?Set the REGISTRY_URL repository variable}"
          : "${REGISTRY_USER:?Set the REGISTRY_USER repository variable}"
          : "${REGISTRY_TOKEN:?Set the REGISTRY_TOKEN repository secret}"
          printf '%s' "$REGISTRY_TOKEN" | docker login \
            -u "$REGISTRY_USER" \
            --password-stdin "$REGISTRY_URL"

      - name: Build and push image
        if: |
          env.skip == 'false'
        run: |
          IMAGE=${{ vars.REGISTRY_URL }}/${{ vars.IMAGE_NAME }}
          docker build \
            --build-arg NEXT_PUBLIC_URL=${{ vars.NEXT_PUBLIC_URL }} \
            -f Dockerfile -t $IMAGE:latest -t $IMAGE:sha-${SHORT_SHA} .
          docker push $IMAGE:latest
          docker push $IMAGE:sha-${SHORT_SHA}

      - name: Logout from Registry
        if: env.skip == 'false'
        run: |
          docker logout

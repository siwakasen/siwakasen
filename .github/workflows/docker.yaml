name: Build and Push Docker Images

on:
  push:
    branches: [master]

jobs:
  build-and-push:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Prepare environment variables
        id: vars
        run: |
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          COMMIT_MESSAGE=$(git log -1 --pretty=%B)
          {
            echo "SHORT_SHA=$SHORT_SHA"
            echo "COMMIT_MESSAGE<<EOF"
            echo "$COMMIT_MESSAGE"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Check for skip keywords
        id: skip-check
        run: |
          if echo "${COMMIT_MESSAGE}" | grep -qE "(skip:build|ci:skip|chore:)"; then
            echo "skip=true" >> $GITHUB_ENV
            echo "Skipping workflow because commit contains skip keyword."
          else
            echo "skip=false" >> $GITHUB_ENV
          fi

      - name: Log in to Registry
        if: env.skip == 'false'
        env:
          REGISTRY_URL: ${{ vars.REGISTRY_URL }}
          REGISTRY_USER: ${{ vars.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          : "${REGISTRY_URL:?Set the REGISTRY_URL repository variable}"
          : "${REGISTRY_USER:?Set the REGISTRY_USER repository variable}"
          : "${REGISTRY_TOKEN:?Set the REGISTRY_TOKEN repository secret}"
          for attempt in 1 2 3; do
            if echo "$REGISTRY_TOKEN" | docker login \
              -u "$REGISTRY_USER" \
              --password-stdin "$REGISTRY_URL"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Docker registry login failed after 3 attempts."
              exit 1
            fi
            echo "Docker registry login attempt $attempt failed, retrying in 10s..."
            sleep 10
          done

      - name: Build and push image
        if: |
          env.skip == 'false'
        run: |
          IMAGE=${{ vars.REGISTRY_URL }}/${{ vars.IMAGE_NAME }}
          docker build \
            --build-arg NEXT_PUBLIC_URL=${{ vars.NEXT_PUBLIC_URL }} \
            -f Dockerfile -t $IMAGE:latest -t $IMAGE:sha-${SHORT_SHA} .
          docker push $IMAGE:latest
          docker push $IMAGE:sha-${SHORT_SHA}

      - name: Logout from Registry
        if: env.skip == 'false'
        run: |
          docker logout
